<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Stackly - Innovative Farming Technology and Sustainable Agriculture"
    >

    <title>
        Stackly | Sustainable Farming
    </title>


    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- =====================================================
         AOS ANIMATION CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/aos@2.3.1/dist/aos.css"
    >


    <!-- =====================================================
         MAIN CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="index.css"
    >

    <link
        rel="stylesheet"
        href="404.css"
    >

</head>


<body>


    <!-- =====================================================
         HERO SECTION
    ====================================================== -->

    <section
        class="farm-hero"
        id="home"
    >


        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="farm-header">

            <div class="farm-header-container">


                <!-- =================================================
                     LOGO
                ================================================== -->

                <a
    href="index.html"
    class="stackly-404-logo"
    aria-label="Stackly Home"
    data-aos="fade-down"
    data-aos-duration="900"
>
    <img
        src="404-logo.webp"
        alt="Stackly Logo"
        class="stackly-404-logo-image"
    >
</a>


                <!-- =================================================
                     DESKTOP NAV
                ================================================== -->

                <nav
                    class="farm-nav"

                    data-aos="fade-down"
                    data-aos-duration="1000"
                    data-aos-delay="100"
                >

                    <a
                        href="index.html"
                        class="active"
                    >
                        Home
                    </a>

                    <a href="about.html">
                        About Us
                    </a>

                    <a href="services.html">
                        Services
                    </a>

                    <a href="blog.html">
                        Blogs
                    </a>

                    <a href="contact.html">
                        Contact Us
                    </a>

                </nav>


                <!-- =================================================
                     DESKTOP ACTIONS
                ================================================== -->

                <div
                    class="farm-header-actions"

                    data-aos="fade-down"
                    data-aos-duration="1000"
                    data-aos-delay="200"
                >

                    <a
                        href="login.html"
                        class="login-btn"
                    >
                        Login
                    </a>

                    <a
                        href="signup.html"
                        class="signup-btn"
                    >
                        Sign up
                    </a>

                </div>


                <!-- =================================================
                     MOBILE HAMBURGER
                ================================================== -->

                <button
                    type="button"
                    class="farm-menu-toggle"
                    id="farmMenuOpen"
                    aria-label="Open menu"

                    data-aos="fade-down"
                    data-aos-duration="900"
                >

                    <i class="fa-solid fa-bars"></i>

                </button>

            </div>

        </header>



        <!-- =================================================
             MOBILE MENU OVERLAY
        ================================================== -->

        <div
            class="farm-menu-overlay"
            id="farmMenuOverlay"
        ></div>



        <!-- =================================================
             MOBILE MENU
        ================================================== -->

        <aside
            class="farm-mobile-menu"
            id="farmMobileMenu"
        >


            <!-- =================================================
                 MOBILE MENU TOP
            ================================================== -->

            <div class="farm-mobile-menu-top">


                <!-- MOBILE LOGO -->

                <a
                    href="index.html"
                    class="farm-mobile-logo"
                    aria-label="Stackly Home"
                >

                    <img
                        src="Stackly-logo-Blue.webp"
                        alt="Stackly Logo"
                        class="farm-mobile-logo-image"
                    >

                </a>


                <!-- EXIT / CLOSE -->

                <button
                    type="button"
                    class="farm-menu-close"
                    id="farmMenuClose"
                    aria-label="Close menu"
                >

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>



            <!-- =================================================
                 MOBILE LINKS
            ================================================== -->

            <nav class="farm-mobile-links">

                <a href="index.html">
                    Home
                </a>

                <a href="about.html">
                    About Us
                </a>

                <a href="services.html">
                    Services
                </a>

                <a href="blog.html">
                    Blogs
                </a>

                <a href="contact.html">
                    Contact Us
                </a>

            </nav>



            <!-- =================================================
                 MOBILE ACTIONS
            ================================================== -->

            <div class="farm-mobile-actions">

                <a
                    href="login.html"
                    class="farm-mobile-login"
                >
                    Login
                </a>

                <a
                    href="signup.html"
                    class="farm-mobile-signup"
                >
                    Sign Up
                </a>

            </div>

        </aside>


        <!-- =====================================================
     404 ERROR SECTION
====================================================== -->

<section class="stackly-404-section">

    <!-- =================================================
         404 IMAGE
    ================================================== -->

    <div
        class="stackly-404-image"
        data-aos="fade-up"
        data-aos-duration="1000"
    >

        <img
            src="404-img.webp"
            alt="404 Page Not Found"
        >

    </div>


    <!-- =================================================
         ERROR CONTENT
    ================================================== -->

    <div
        class="stackly-404-content"
        data-aos="fade-up"
        data-aos-delay="250"
        data-aos-duration="900"
    >

        <h1>
            Oops! This Page Seems<br>
            to be off the field!
        </h1>


        <p>
            Looks like the event you're looking for is off the<br>
            stage. Let's get you back on track
        </p>


        <a
            href="index.html"
            class="stackly-404-button"
        >
            Back to Home
        </a>

    </div>


    <!-- =================================================
         BOTTOM FARM IMAGE
    ================================================== -->

    <div
        class="stackly-404-farm"
        data-aos="fade-up"
        data-aos-delay="400"
        data-aos-duration="1000"
    >

        <img
            src="404-farm.webp"
            alt="Farm illustration"
        >

    </div>

</section>

    
</section>

<!-- =====================================================
         AOS JAVASCRIPT
    ====================================================== -->

    <script
        src="https://unpkg.com/aos@2.3.1/dist/aos.js"
    ></script>


    <!-- =====================================================
         MAIN JAVASCRIPT
    ====================================================== -->

    <script src="index.js"></script>


</body>

</html>
