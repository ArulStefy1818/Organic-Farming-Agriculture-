<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Stackly - Innovative Farming Technology and Sustainable Agriculture"
    >

    <title>
        Stackly | Sustainable Farming
    </title>


    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- =====================================================
         AOS ANIMATION CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/aos@2.3.1/dist/aos.css"
    >


    <!-- =====================================================
         MAIN CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="404-dashboard.css"
    >

</head>


<body>


<!-- =====================================================
     404 ERROR SECTION
====================================================== -->

<section class="stackly-404-section">

    <!-- =================================================
         404 IMAGE
    ================================================== -->

    <div
        class="stackly-404-image"
        data-aos="fade-up"
        data-aos-duration="1000"
    >

        <img
            src="404-img.webp"
            alt="404 Page Not Found"
        >

    </div>


    <!-- =================================================
         ERROR CONTENT
    ================================================== -->

    <div
        class="stackly-404-content"
        data-aos="fade-up"
        data-aos-delay="250"
        data-aos-duration="900"
    >

        <h1>
            Oops! This Page Seems<br>
            to be off the field!
        </h1>


        <p>
            Looks like the event you're looking for is off the<br>
            stage. Let's get you back on track
        </p>


        <a
            href="admin.html"
            class="stackly-404-button"
        >
            Back to Dashboard
        </a>

    </div>


    <!-- =================================================
         BOTTOM FARM IMAGE
    ================================================== -->

    <div
        class="stackly-404-farm"
        data-aos="fade-up"
        data-aos-delay="400"
        data-aos-duration="1000"
    >

        <img
            src="404-farm.webp"
            alt="Farm illustration"
        >

    </div>

</section>

<!-- =====================================================
         AOS JAVASCRIPT
    ====================================================== -->

    <script
        src="https://unpkg.com/aos@2.3.1/dist/aos.js"
    ></script>


    <!-- =====================================================
         MAIN JAVASCRIPT
    ====================================================== -->

    <script src="index.js"></script>


</body>

</html>
