<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
         BASIC DOCUMENT SETTINGS
    ====================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Stackly - Innovative Farming Technology and Sustainable Agriculture"
    >

    <meta
        name="theme-color"
        content="#f7f9f4"
    >

    <title>
        Stackly | Page Not Found
    </title>


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86zC0Yq6N1x3rP8d7n9nD3vT2M4R4xM6x5x5x5x5x5A=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >


    <!-- =====================================================
         AOS ANIMATION CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/aos@2.3.1/dist/aos.css"
    >


    <!-- =====================================================
         404 PAGE CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="404-dashboard.css"
    >

</head>


<body>


    <!-- =====================================================
         STACKLY 404 ERROR PAGE
    ====================================================== -->

    <main
        class="stackly-404-section"
        aria-labelledby="stackly404Title"
    >


        <!-- =================================================
             404 TOP IMAGE
        ================================================== -->

        <div
            class="stackly-404-image"
            data-aos="fade-up"
            data-aos-duration="1000"
        >

            <img
                src="404-img.webp"
                alt="404 - Page not found"
                width="480"
                height="225"
            >

        </div>


        <!-- =================================================
             ERROR CONTENT
        ================================================== -->

        <div
            class="stackly-404-content"
            data-aos="fade-up"
            data-aos-delay="250"
            data-aos-duration="900"
        >

            <h1 id="stackly404Title">

                Oops! This Page Seems
                <br>
                to be off the field!

            </h1>


            <p>

                Looks like the event you're looking for is off the
                <br>
                stage. Let's get you back on track.

            </p>


            <!-- =================================================
                 BACK TO DASHBOARD
            ================================================== -->

            <a
                href="client.html"
                class="stackly-404-button"
                aria-label="Back to Stackly client dashboard"
            >

                <span>
                    Back to Dashboard
                </span>

                <i
                    class="fa-solid fa-arrow-right"
                    aria-hidden="true"
                ></i>

            </a>

        </div>


        <!-- =================================================
             BOTTOM FARM IMAGE
        ================================================== -->

        <div
            class="stackly-404-farm"
            data-aos="fade-up"
            data-aos-delay="400"
            data-aos-duration="1000"
        >

            <img
                src="404-farm.webp"
                alt="Organic farm illustration"
                width="980"
                height="205"
            >

        </div>


    </main>


    <!-- =====================================================
         AOS JAVASCRIPT
    ====================================================== -->

    <script
        src="https://unpkg.com/aos@2.3.1/dist/aos.js"
    ></script>


    <!-- =====================================================
         MAIN JAVASCRIPT
    ====================================================== -->

    <script src="index.js"></script>


    <!-- =====================================================
         INITIALIZE AOS
         
         Keep this here only if index.js does not already
         initialize AOS.
    ====================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                if (typeof AOS !== "undefined") {

                    AOS.init({

                        duration: 900,

                        easing: "ease-out-cubic",

                        once: true,

                        offset: 60,

                        mirror: false

                    });

                }

            }
        );

    </script>


</body>

</html>
